name = "dealsjunction"  # ✅ UNIQUE name
main = "src/index.ts"
compatibility_date = "2024-06-27"
workers_dev = true
compatibility_flags = ["nodejs_compat"] # ✅ only if still needed

[env.production]
name = "dealsjunction-prod"

[vars]
TWITTER_API_KEY = "your_key"
TWITTER_API_SECRET = "your_secret"
TWITTER_ACCESS_TOKEN = "your_token"
TWITTER_ACCESS_SECRET = "your_access_secret"
USER_ID = "111111"
USER_AGENT = "Mozilla/5.0 (Macintosh; Intel Mac OS X 13_5_2) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.1 Safari/605.1.15"

[dev]
port = 8787