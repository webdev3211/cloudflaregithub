name = "dealsjunction"  # Unique name for development environment
main = "src/index.ts"
compatibility_date = "2024-06-27"
workers_dev = true
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8787
# You can also load local environment vars from .dev.vars if needed

[vars]  # 👈 Default environment (used for `wrangler dev`)
TWITTER_API_KEY = "your_dev_key"
TWITTER_API_SECRET = "your_dev_secret"
TWITTER_ACCESS_TOKEN = "your_dev_token"
TWITTER_ACCESS_SECRET = "your_dev_access_secret"
USER_ID = "your_dev_user_id"
USER_AGENT = "your_dev_user_agent"

[env.production]
name = "dealsjunction-prod"  # Unique name for production deployment

[env.production.vars]  # 👈 Vars used ONLY during `wrangler deploy --env production`
